decisions:
- 不设测试计划表：版本直接持有执行记录，一条执行记录对应一条用例，关联用例即建执行记录行
- 用例表是规格场景的派生投影，不是真源；真源始终是 specs/<dir>/spec.md
- 用例执行情况表不进表导航（kind=detail），只经版本行的弹层展示
- 执行清单只由 ver.runs 持有，run 不得反向指版本（引擎禁双向）
- 同一版本内同一用例只有一条执行记录，重跑就地更新，不新建行
- 进度与结论分两个字段：run.state 表达是否执行，run.result 表达通过与否；版本表只消费 state，不消费 result
- 六节点串行推进，不提供"跳过"；failed 不是终态，返工改回 doing
- 节点闸门一致性由写入期校验保证：测试节点要求用例全部执行、测试验收要求缺陷清零与回归通过、开发验收要求规格全部验收
- 发布条件自 board@4 起只由六节点之与决定，三布尔降为展示字段
- 允许版本长期 planned 或 dropped；不发布用 release_status 表达
- 版本表 Bug 字段去掉"上一版本"字样，但集合语义仍是"本版需要清零的缺陷"，默认来源是上一版本
- 用例行 id 采用场景号，执行记录行 id 采用 <版本号>--<用例号>，均只含安全字符
- 测试进度只统计本版本已纳入的用例（ver.runs）；未纳入的用例不进分母、不影响判定，覆盖率由"测试设计"节点把关
- 版本表三个用例字段沿用 empty_set 语义：本版一条用例都没纳入时，用例总数 0、已完成 0、用例是否完成为真
