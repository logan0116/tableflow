name: 功能建议
description: 提出新能力或口径改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前做不成什么，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: 是否涉及看板契约
      description: 涉及 board@5 的字段、闸门或判定口径时要走契约变更流程
      options:
        - 不涉及
        - 涉及字段 / 表结构
        - 涉及闸门或判定口径
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
