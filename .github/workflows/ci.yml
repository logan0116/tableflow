name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 锁文件一致性
        run: uv lock --check --directory backend
      - name: 安装依赖（按锁文件）
        run: uv sync --frozen --directory backend
      - name: pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: 前端构建与依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 版本号一致
        run: |
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/src/tableflow/__init__.py)
          js=$(node -p "require('./frontend/package.json').version")
          [ -n "$py" ] && [ "$py" = "$js" ] || { echo "版本号不一致：backend=$py frontend=$js"; exit 1; }
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit
      - name: 生产构建
        working-directory: frontend
        run: npm run build
      - name: 依赖审计
        working-directory: frontend
        run: npm audit --audit-level=high
